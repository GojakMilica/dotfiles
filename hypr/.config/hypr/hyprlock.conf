# Hyprlock config (hyprlang, hyprlock does not read Lua)
# Colors mirror theme/palette ("Šljiva u magli"); hyprlock can't source name=#hex directly

$kora     = rgb(2A2C2B)
$latica   = rgb(F7F3EF)
$tresnja  = rgb(D9A7B0)
$kamelija = rgb(C26B73)
$sveca    = rgb(D4B07A)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/dotfiles/theme/images/sljiva.jpg
    blur_passes = 2
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = $latica
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    outer_color = $tresnja
    inner_color = $kora
    font_color = $latica
    check_color = $sveca
    fail_color = $kamelija
    placeholder_text = Lozinka
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
