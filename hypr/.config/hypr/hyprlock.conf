# Hyprlock config (hyprlang, hyprlock does not read Lua)
# Colors mirror theme/palette ("Šljiva u magli"); hyprlock can't source name=#hex directly

$latica          = rgb(F7F3EF)
$latica_providna = rgba(F7F3EF26) # latica, ~15%, so the pill takes the background's shade
$izmaglica       = rgb(E9E5E1)
$tresnja         = rgb(D9A7B0)
$kamelija        = rgb(C26B73)
$sveca           = rgb(D4B07A)

general {
    hide_cursor = true
}

# Generated by: theme/process-image.sh --lock theme/images/tresnja.jpg
# (already darkened and blurred there, so no blur here)
background {
    monitor =
    path = ~/dotfiles/theme/images/generated/tresnja-lock.jpg
}

# Clock
label {
    monitor =
    text = $TIME
    font_family = Cormorant Garamond
    font_size = 96
    color = $latica
    position = 0, 190
    halign = center
    valign = center
}

# Date in Serbian; datum.sh avoids depending on an installed sr locale
label {
    monitor =
    text = cmd[update:60000] echo "<i>$(~/.config/hypr/datum.sh)</i>"
    font_family = Cormorant Garamond
    font_size = 26
    color = $izmaglica
    position = 0, 95
    halign = center
    valign = center
}

# Password pill; font_color colors the dots
# Placeholder font size is height / 4 (no font_size option), so 64 matches the layout label's 16
input-field {
    monitor =
    size = 320, 64
    outline_thickness = 2
    rounding = -1
    inner_color = $latica_providna
    outer_color = $tresnja
    font_color = $latica
    check_color = $sveca
    fail_color = $kamelija
    dots_size = 0.25
    dots_spacing = 0.3
    font_family = Cormorant Garamond
    placeholder_text = Lozinka
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Current keyboard layout
label {
    monitor =
    text = $LAYOUT
    font_family = Cormorant Garamond
    font_size = 16
    color = $izmaglica
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>zdravo :&gt;</i>
    font_family = Cormorant Garamond
    font_size = 22
    color = $izmaglica
    position = 0, 40
    halign = center
    valign = bottom
}
